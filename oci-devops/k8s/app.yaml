apiVersion: v1
kind: Namespace
metadata:
  name: chair-shop
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chair-shop-sqlite
  namespace: chair-shop
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chair-shop-api
  namespace: chair-shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: chair-shop-api }
  template:
    metadata:
      labels: { app: chair-shop-api }
    spec:
      containers:
        - name: api
          image: ${OCIR_REGISTRY}/chair-shop-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:sqlite:/app/data/cedar-form.db
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: sqlite-data
          persistentVolumeClaim: { claimName: chair-shop-sqlite }
---
apiVersion: v1
kind: Service
metadata:
  name: chair-shop-api
  namespace: chair-shop
spec:
  type: ClusterIP
  selector: { app: chair-shop-api }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chair-shop-web
  namespace: chair-shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: chair-shop-web }
  template:
    metadata:
      labels: { app: chair-shop-web }
    spec:
      containers:
        - name: web
          image: ${OCIR_REGISTRY}/chair-shop-web:${IMAGE_TAG}
          imagePullPolicy: Always
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: chair-shop-web
  namespace: chair-shop
spec:
  type: LoadBalancer
  selector: { app: chair-shop-web }
  ports:
    - name: http
      port: 80
      targetPort: 80
